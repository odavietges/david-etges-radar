name: Validar publicação pública
run-name: "Validar publicação pública · ${{ inputs.publication_id || github.run_id }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_current:
        description: Exigir edição da data corrente em America/Cuiaba
        type: boolean
        default: true
      expected_sha:
        description: SHA editorial esperado (vazio usa o SHA do disparo)
        type: string
        default: ''
      expected_date:
        description: Data editorial esperada YYYY-MM-DD
        type: string
        default: ''
      publication_id:
        description: Identificador da execução publicadora
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: pulse-public-validation-${{ inputs.publication_id || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validar:
    name: Conferir edição e histórico no Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ler o commit publicado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exigir deploy concluído para o mesmo SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: python3 operacao/estado_publicacao.py await-pages
      - name: Confirmar conteúdo público e histórico
        env:
          REQUIRE_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_current }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          EXPECTED_DATE: ${{ inputs.expected_date }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          if [ "$REQUIRE_CURRENT" = "true" ]; then
            python3 operacao/verificar_publicacao.py --require-current
          else
            python3 operacao/verificar_publicacao.py
          fi
